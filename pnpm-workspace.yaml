packages:
  - 'packages/*'
  - 'apps/*'

# Which dependencies may run install scripts. pnpm refuses to install until
# every package it asks about has an explicit answer here, so a fresh clone and
# CI resolve identically instead of depending on whoever answered a prompt.
#
# Only the two that produce something the build needs are allowed. The rest are
# native speedups with working JavaScript fallbacks, or postinstall steps that
# generate artefacts nothing here reads.
allowBuilds:
  esbuild: true
  '@tailwindcss/oxide': true
  '@reown/appkit': false
  bufferutil: false
  keccak: false
  protobufjs: false
  sharp: false
  unrs-resolver: false
  utf-8-validate: false
